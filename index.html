<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#70c5ce;
    overflow:hidden;
}

canvas{
    background:#87CEEB;
    border:4px solid #333;
}
</style>

</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const bird={
    x:80,
    y:250,
    w:30,
    h:30,
    velocity:0,
    gravity:0.5,
    jump:-8
};

const pipes=[];
const gap=170;
const pipeWidth=60;

let score=0;
let gameOver=false;

function spawnPipe(){
    let topHeight=Math.random()*250+50;

    pipes.push({
        x:canvas.width,
        top:topHeight,
        bottom:topHeight+gap,
        counted:false
    });
}

setInterval(()=>{
    if(!gameOver)
        spawnPipe();
},1700);

document.addEventListener("keydown",()=>{
    if(gameOver){
        location.reload();
    }else{
        bird.velocity=bird.jump;
    }
});

canvas.addEventListener("click",()=>{
    if(gameOver){
        location.reload();
    }else{
        bird.velocity=bird.jump;
    }
});

function update(){

    bird.velocity+=bird.gravity;
    bird.y+=bird.velocity;

    if(bird.y<0) bird.y=0;

    if(bird.y+bird.h>canvas.height)
        gameOver=true;

    pipes.forEach(pipe=>{

        pipe.x-=3;

        if(
            bird.x<pipe.x+pipeWidth &&
            bird.x+bird.w>pipe.x &&
            (
                bird.y<pipe.top ||
                bird.y+bird.h>pipe.bottom
            )
        ){
            gameOver=true;
        }

        if(!pipe.counted && pipe.x+pipeWidth<bird.x){
            score++;
            pipe.counted=true;
        }

    });

}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Pipes
    ctx.fillStyle="green";

    pipes.forEach(pipe=>{

        ctx.fillRect(pipe.x,0,pipeWidth,pipe.top);

        ctx.fillRect(
            pipe.x,
            pipe.bottom,
            pipeWidth,
            canvas.height-pipe.bottom
        );

    });

    // Bird
    ctx.fillStyle="yellow";
    ctx.beginPath();
    ctx.arc(
        bird.x+15,
        bird.y+15,
        15,
        0,
        Math.PI*2
    );
    ctx.fill();

    // Eye
    ctx.fillStyle="black";
    ctx.beginPath();
    ctx.arc(
        bird.x+20,
        bird.y+10,
        3,
        0,
        Math.PI*2
    );
    ctx.fill();

    // Score
    ctx.fillStyle="white";
    ctx.font="30px Arial";
    ctx.fillText(score,20,40);

    if(gameOver){

        ctx.fillStyle="rgba(0,0,0,0.6)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="white";
        ctx.font="40px Arial";
        ctx.fillText("Game Over",90,250);

        ctx.font="22px Arial";
        ctx.fillText("Score: "+score,150,300);
        ctx.fillText("Press Space or Click",75,350);
    }

}

function gameLoop(){

    if(!gameOver)
        update();

    draw();

    requestAnimationFrame(gameLoop);

}

gameLoop();
</script>

</body>
</html>
